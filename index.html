<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="theme-color" content="#f2f2f7"/>
  <meta name="description" content="나만의 핸드드립 레시피를 만들고, 시간에 맞춰 물 붓기와 스월링, 스티어링을 안내받으세요."/>
  <meta name="apple-mobile-web-app-title" content="Pour Guide"/>
  <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg?v=coffee-1"/>
  <link rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%apple-touch-icon.png?v=coffee-1"/>
  <link rel="manifest" href="%BASE_URL%site.webmanifest?v=coffee-1"/>
  <title>Pour Guide — 나만의 커피 리추얼</title>
  <script>/* Mirrors src/theme.ts (key, default, dark resolution, chrome color) so the saved mode paints before React. */try{var s=localStorage.getItem("pour-guide.theme.v1");var d=s==="dark"||(s!=="light"&&matchMedia("(prefers-color-scheme: dark)").matches);document.documentElement.dataset.theme=d?"dark":"light";var c=document.querySelector('meta[name="theme-color"]');if(c)c.setAttribute("content",d?"#000000":"#f2f2f7")}catch(e){document.documentElement.dataset.theme=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"}</script>
</head>
<body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body>
</html>
